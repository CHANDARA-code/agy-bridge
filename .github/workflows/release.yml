name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Tag must match package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - run: npm run check
      - run: npm --prefix panel ci
      - run: npm --prefix panel run build
      - run: npm test
      - name: Pack
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=""
          if [ "${PRERELEASE}" = "true" ]; then flags="--prerelease"; fi
          # Release notes are the CHANGELOG.md entry for this version.
          node -e '
            const version = process.argv[1];
            const text = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf(`## [${version}]`);
            if (start === -1) process.exit(1);
            const rest = text.slice(text.indexOf("\n", start) + 1);
            const end = rest.search(/^## \[|^\[[^\]]+\]: /m);
            process.stdout.write((end === -1 ? rest : rest.slice(0, end)).trim() + "\n");
          ' "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "${GITHUB_REF_NAME}" ./*.tgz --verify-tag --notes-file notes.md --title "${GITHUB_REF_NAME}" ${flags}

  npm-publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check for an npm token
        id: token
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: package
      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          tag="latest"
          if [ "${PRERELEASE}" = "true" ]; then tag="next"; fi
          npm publish ./*.tgz --access public --provenance --tag "${tag}"
